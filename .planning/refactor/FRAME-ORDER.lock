# FRAME-ORDER.lock — the second of two levers.
#
# Per-frame step order is the one class of regression in this mod that can ship
# completely silently: refactor-guard.sh proves BLAST RADIUS, and a reorder inside
# BoardDriver.Update is an ordinary diff inside a type the refactor legitimately
# touched — the guard's PASS condition for a Tier-1 motion (CHARTER §3b.2).
#
# So each locked ordering is stated twice: once as a `// FRAME-ORDER` marker
# comment beside the code, and once here. scripts/check-frame-order.sh enforces
#
#   1. the marker's tokens occur, in that order, in the source after the marker;
#   2. the marker's bracket list is byte-identical to the line below.
#
# (1) alone catches "I tidied the Update method". (2) catches "I tidied the Update
# method AND the comment". Together they mean a frame order cannot change by
# accident — three files, in agreement, in one commit. A deliberate change is still
# possible, and is Tier 3.
#
# Format:  <id> | <file> | <mode> | [<step>, <step>, ...]
#   mode `ordered`             — the steps run in this order after the marker
#   mode `LateUpdate-required` — the steps sit inside a LateUpdate body
#   a `GATE:` prefix marks a control-flow gate the steps around it straddle
#
# NOT LOCKED, ON PURPOSE
# ----------------------
# Six further orderings (REVIEW-Hands-Board-Core §P2 sites 8–13: MixedReality.Tick's
# sky ordering, RayInteractor.Tick's fan occluder, UguiPointer.TryRaycast's override
# write, HandsDriver.TearDown, HandVisuals' socket creation, and
# FigureOverlay.BuildFrozenGhost's destroy order) are single-method-local and already
# state their reason at the code. A lock entry adds nothing a reader would miss.
#
# And NO `[DefaultExecutionOrder]` anywhere: the two cross-MonoBehaviour orderings
# (BoardDriver.SyncRayMask, FigureGrabDriver.TickLaserGrab) are deliberately NOT
# relied upon — sticky mask, two-frame freshness window. Freezing an order the code
# does not depend on is a behaviour change wearing a tidy-up costume. Both sites
# carry a comment saying so, and no marker.

# THE 2026-08 AUDIT (PLAN-2026-08.md, phase 1.4)
# ---------------------------------------------
# The seven entries below this note were written when the mod was 182 files. It is now 485, and
# 311 of those files have never been through a refactor. So the audit asked the lock's OWN
# question of the new code — does the ordering span more than one method, or is it non-obvious at
# the site? — rather than "what looks long".
#
# MEASURED FIRST. 394 per-frame or Tick-shaped methods exist; 81 of them sequence four or more
# distinct steps and sit in files added since the charter. Locking those would be the opposite of
# this file's rule: a call list that reads top to bottom inside ONE method is visible in one diff
# and needs nothing here.
#
# So the filter was different: find orderings the source ALREADY DECLARES load-bearing in prose
# and that nothing checks. Two earned an entry, and the first of them had been named as unguarded
# by the very refactor that created its file:
#
#   CardsDriver.1.Core.cs — "SPLITTING A FILE DOES NOT SPLIT THE CALL ORDER. One coupling now
#   spans a cut and is worth naming here because neither compiler nor guard will."
#
# CONSIDERED AND DELIBERATELY NOT LOCKED — each is single-method-local, i.e. the whole ordering is
# visible in one screen of one diff, which is the condition this file exists to escape:
#   * VRRigDriver's spawn-kind precedence ("kind change > our camera/root destroyed > anchor
#     destroyed"), MapLocationInteractor.Tick's "drop the old selection FIRST",
#     MaterialLoaderHeal's round-8 order fix, MapIconLayer's floor-the-product rule.
#   * Plugin's module registry order (Core first, Compat last) and CoreModule's JIT ordering are
#     STARTUP, not per-frame. A different hazard; this file is about the frame.
#   * UiSoundEar's "must run before the dispatch" and FocusDriver's sortingOrder rule cross
#     component boundaries where Unity's relative order is undefined anyway — the BoardDriver
#     note below states why freezing such an order is a behaviour change wearing a tidy-up
#     costume, and that reasoning is unchanged.

