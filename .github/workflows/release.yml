# GloomhavenVR — release.
#
# TRIGGER: a push to `main`. `main` IS the release branch; `dev` is where work lands.
# Pushing `dev` into `main` publishes a release. There is nothing else to do and no
# button to press — which is why the first push to `main` deserves a moment's thought
# before it is typed.
#
# THE ONE INVARIANT THIS WORKFLOW EXISTS TO PROTECT
# -------------------------------------------------
# `main` is only ever a fast-forward of `dev`. Nothing but `git push origin dev:main`
# ever writes to it — not this workflow, not anybody. That is why the release procedure
# stays one command forever instead of turning into a merge-back ritual.
#
# An earlier version of this file broke that invariant: it committed the version bump
# ONTO `main` and pushed `HEAD:main`. It worked once. The second `git push origin
# dev:main` was then a non-fast-forward and GitHub rejected it, because `main` carried
# a commit `dev` had never seen. The "refuse if origin/main moved" guard could not
# catch it — the thing that moved `main` was the previous run of this same workflow.
# So the pipeline wedged exactly one release after it appeared to work.
#
# The fix is structural: **this workflow never pushes a commit to `main`.** It writes
# exactly two refs, and neither of them is a branch on the release side:
#
#     refs/tags/v<version>     the release tag, pointing AT the pushed commit
#     refs/heads/dev           the bookkeeping bump for the NEXT version
#
# That also makes the pipeline immune to branch protection on `main`: a branch ruleset
# blocks commits, and this workflow has none to push. See docs/CI-CD.md §2.1.
#
# WHAT IT DOES, in order
#   1. read <Version> from src/GloomhavenVR/GloomhavenVR.csproj — no edit, no commit.
#      That value IS the version being released. The checkout is already clean and
#      already at the exact commit that will be tagged, so the DLL is stamped from a
#      clean tree with no ceremony required.
#   2. refuse early if v<version> already exists, or if the commit is not contained in
#      `dev` (releasing such a commit is what breaks the invariant above)
#   3. build with GhvrReleaseBuild=true (=> BuildInfo.IsDevBuild is false) and run the
#      same gates CI runs
#   4. scripts/package-release.sh -> dist/GloomhavenVR-<version>.zip, asserted by name
#      and asserted to contain the asset bundle
#   5. push the TAG (only the tag), then create the GitHub Release with the zip
#   6. bookkeeping: bump <Version> on `dev` so the next release has a fresh number
#
# THE HAZARDS AND HOW THEY ARE SOLVED — see docs/CI-CD.md for the long version.
#
#   Infinite loop. Structurally impossible now: this workflow triggers on `main` and
#   writes only to tags and to `dev`, and `dev`'s workflow (ci.yml) publishes nothing
#   and pushes nothing. The old `[skip ci]` marker on the bump commit is deliberately
#   GONE — see the "Bump dev" step for why it turned from a safety net into a trap.
#
#   Tag / version disagreement. The version is READ once from the csproj and never
#   written during a release. package-release.sh names the zip with the same sed
#   expression, the tag is v$VERSION, the release title is $VERSION, and the DLL is
#   compiled from the very commit the tag points at. The workflow then asserts the zip
#   exists under the exact expected name before it publishes anything.
#
#   Two releases fired close together. `concurrency` with cancel-in-progress FALSE
#   queues runs instead of cancelling them (a half-published release is worse than a
#   slow one). The second run reads the same <Version> — because the bump commit from
#   the first run is on `dev`, not on the commit the second run is building — sees that
#   v<version> already exists, and refuses BEFORE building anything. The remedy is the
#   ordinary one: `git push origin dev:main` again, which now carries the bump.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write        # push the tag, create the release, push the bookkeeping bump
                         # to `dev`. GITHUB_TOKEN with this scope is sufficient — no PAT
                         # is needed. A branch ruleset on `main` does NOT affect this
                         # workflow (it pushes no commit to main). A branch ruleset on
                         # `dev`, or a TAG ruleset on `v*`, would — docs/CI-CD.md §2.1.

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  # JOB-LEVEL, not `-p:` on one command: scripts/package-release.sh runs its own
  # `dotnet build` internally, and MSBuild reads environment variables as properties,
  # so this reaches every build in the job. A `-p:` would not.
  GhvrReleaseBuild: 'true'

jobs:
  release:
    name: Build, package and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history and tags — release notes need both)
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      # -----------------------------------------------------------------------------
      # Decide the version and refuse early. Everything here is cheap; none of it may
      # run after a fifteen-minute build, because the whole point is to fail before
      # anything has been produced that could be half-published.
      # -----------------------------------------------------------------------------
      - name: Determine the version and check it can be released
        id: version
        run: |
          set -euo pipefail

          # `bash scripts/bump-version.sh` with no argument PRINTS the version and
          # changes nothing. The release is of the number that is already committed —
          # the workflow no longer writes it, so there is no bump commit to place on
          # `main` and no dirty tree to stamp around.
          VERSION="$(bash scripts/bump-version.sh)"
          echo "Releasing $VERSION from ${GITHUB_SHA}"

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error title=Version already released::Tag v$VERSION already exists."
            echo "::error::Nothing was built. Two ways this happens:"
            echo "::error::  (a) two releases were fired close together — the bump commit for the"
            echo "::error::      previous one is on 'dev', not on this commit. Run"
            echo "::error::      'git push origin dev:main' again; dev now carries the bump."
            echo "::error::  (b) you re-pushed an old commit. Set <Version> in"
            echo "::error::      src/GloomhavenVR/GloomhavenVR.csproj past v$VERSION on dev."
            exit 1
          fi

          # THE INVARIANT CHECK. `main` must never contain a commit `dev` does not,
          # or the next `git push origin dev:main` is a non-fast-forward and the whole
          # release procedure wedges. Checked here, before the build, so the cost of
          # being told is thirty seconds rather than a wasted run.
          #
          # FETCH_HEAD, not origin/dev, and that is not a stylistic choice:
          # actions/checkout narrows `remote.origin.fetch` to the ref it checked out,
          # so refs/remotes/origin/dev may simply not exist on the runner even after a
          # successful fetch. `git merge-base` against a name that does not resolve
          # exits non-zero — which this guard would have read as "not contained in dev"
          # and turned into a refusal to release anything, ever. FETCH_HEAD is written
          # by every `git fetch <remote> <ref>` regardless of the refspec.
          git fetch --no-tags origin dev
          DEV_TIP="$(git rev-parse FETCH_HEAD)"
          echo "dev tip: $DEV_TIP"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$DEV_TIP"; then
            echo "::error title=main would move ahead of dev::The commit being released"
            echo "::error::($GITHUB_SHA) is not contained in origin/dev."
            echo "::error::Releasing it would leave 'main' ahead of 'dev', and your next"
            echo "::error::'git push origin dev:main' would be REJECTED as a non-fast-forward."
            echo "::error::Get this commit onto dev first (cherry-pick or merge), then push dev:main."
            echo "::error::Nothing was built and nothing was published."
            exit 1
          fi

          # A release stamped `…-dirty` is a bug report waiting to happen. The old
          # design created a bump commit to guarantee a clean tree; this design starts
          # clean and asserts it instead of assuming it.
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error title=Dirty tree at checkout::The working tree is not clean before"
            echo "::error::the build; the DLL would be stamped '-dirty'."
            git status --porcelain --untracked-files=no
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Unity XR package sources
        uses: actions/cache@v5.1.0
        with:
          path: tools/RuntimeDepsBuild/sources
          key: xrsources-${{ hashFiles('scripts/build-runtimedeps.sh') }}

      - name: Verify reference assemblies contain no method bodies
        run: python3 scripts/check-refasm.py

      - name: Build Unity XR RuntimeDeps
        run: bash scripts/build-runtimedeps.sh

      - name: Fetch OpenXR natives
        # SHA256-pinned download from the needle-mirror package tag. No Unity editor
        # is involved: these two DLLs ship prebuilt inside com.unity.xr.openxr.
        run: bash scripts/fetch-natives.sh

      - name: Build (0 errors, exactly 6 known warnings)
        run: bash scripts/ci-build.sh Release

      - name: Mirrored-constant lint
        run: bash scripts/check-mirrors.sh

      - name: Per-frame order lock
        run: bash scripts/check-frame-order.sh

      - name: Patch inventory drift
        run: bash scripts/patch-inventory.sh check

      - name: Wire coverage
        run: python3 scripts/check-wire-coverage.py

      # Skipped with a notice on a runner: the tester's cfg drop it compares against
      # lives in gitignored .planning/debug/. See the same step in ci.yml.
      - name: Config defaults rebase
        run: |
          if [ -d .planning/debug/default ]; then
            python3 scripts/rebase-defaults.py check
          else
            echo "::notice title=Config defaults not checked::The tester cfg drop is gitignored and absent on a runner. Run scripts/rebase-defaults.py check locally before a release."
          fi

      - name: Asset bundle format
        run: bash scripts/check-bundle-format.sh

      - name: Wire tests (compile only — vectors need the real game DLL)
        run: |
          dotnet build tests/GloomhavenVR.WireTests/GloomhavenVR.WireTests.csproj \
                       -c Release --nologo -v minimal
          echo "::warning title=Wire vectors not executed for this release::The golden-vector assertions cannot run on a hosted runner (they load the game's real UnityEngine.CoreModule.dll). Run scripts/wire-tests.sh locally before pushing to main."

      - name: Package
        run: bash scripts/package-release.sh

      - name: Verify the artifact matches the version being tagged
        run: |
          set -euo pipefail
          ZIP="dist/GloomhavenVR-${{ steps.version.outputs.version }}.zip"
          [[ -f "$ZIP" ]] || { echo "::error::$ZIP was not produced"; ls -la dist || true; exit 1; }
          echo "artifact: $ZIP ($(stat -c%s "$ZIP") bytes)"
          # The bundle is the bulk of it. If it is missing the zip is ~4 MB and the
          # mod silently falls back to procedural visuals for every 3D asset.
          unzip -l "$ZIP" | grep -q 'BepInEx/plugins/GloomhavenVR/gloomhavenvr.bundle' \
            || { echo "::error::the asset bundle is not in the archive"; exit 1; }
          # The build must not have dirtied a tracked file behind our back — the stamp
          # inside that DLL is only trustworthy if this is still true.
          [[ -z "$(git status --porcelain --untracked-files=no)" ]] \
            || { echo "::error::the build modified tracked files; the DLL stamp reads '-dirty'";
                 git status --porcelain --untracked-files=no; exit 1; }

      - name: Render release notes
        run: bash scripts/release-notes.sh "${{ steps.version.outputs.version }}" RELEASE_NOTES.md

      # -----------------------------------------------------------------------------
      # Publish. Tag FIRST, release SECOND: a rejected tag push must leave nothing
      # behind, and `gh release create --verify-tag` refuses to invent one.
      #
      # NOTE what is NOT here: any push to `main`. The tag points at ${{ github.sha }},
      # which is what `main` already points at, so `main` and `dev` stay identical and
      # the next `git push origin dev:main` is an ordinary fast-forward.
      # -----------------------------------------------------------------------------
      - name: Push the tag
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          # Re-read from the remote: the early check was ~15 minutes ago.
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG appeared on the remote while this release was building."
            echo "::error::Nothing was published. Someone else released this version."
            exit 1
          fi

          # `main` may legitimately have moved FORWARD while we built (a second push).
          # That is fine — our tag names the commit we actually built and tested. What
          # is not fine is `main` having moved AWAY from it (a force-push backwards):
          # the tag would then advertise a commit the release branch no longer has.
          git fetch --no-tags origin main          # FETCH_HEAD — see the version step
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$(git rev-parse FETCH_HEAD)"; then
            echo "::error::main no longer contains $GITHUB_SHA — it was rewritten while"
            echo "::error::this release was building. Nothing was published."
            exit 1
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "GloomhavenVR ${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "pushed $TAG -> $GITHUB_SHA"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/GloomhavenVR-${{ steps.version.outputs.version }}.zip" \
            --title "GloomhavenVR ${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            --latest
          echo "Published ${{ steps.version.outputs.tag }}"

      # -----------------------------------------------------------------------------
      # Bookkeeping — AFTER the release is live, because it is not part of the release.
      # If this step fails the release is still complete and correct; only the next
      # version number needs a hand. That is the whole reason it is last.
      #
      # This is where the bump commit lives now: on `dev`, on top of whatever `dev` is
      # at this moment, NOT on `main`. `dev` is therefore always exactly `main` plus
      # this one commit (plus whatever work has landed since), so `git push origin
      # dev:main` is a fast-forward for the second release and for every release after
      # it. That is the bug this file was rewritten to fix.
      #
      # NO `[skip ci]` IN THE SUBJECT, deliberately, and this is a reversal:
      #   * it is not needed for its original purpose. A push made with GITHUB_TOKEN
      #     does not start a workflow run — documented GitHub behaviour — and even if
      #     it did, `dev` runs ci.yml, which releases nothing and pushes nothing. The
      #     loop the marker guarded against cannot exist in this topology.
      #   * and it is now actively harmful. This commit sits on `dev` and will one day
      #     be the HEAD commit of a `git push origin dev:main` — releasing twice with
      #     no work in between does exactly that. GitHub honours `[skip ci]` on the
      #     head commit of a push, so the marker would silently suppress a real
      #     release: no run, no error, no annotation. A safety net that turns into a
      #     trap gets removed.
      # -----------------------------------------------------------------------------
      - name: Bump <Version> on dev for the next release
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            # FETCH_HEAD throughout, not origin/dev — actions/checkout may not maintain
            # a remote-tracking ref for it. See the version step for the full note.
            git fetch --no-tags origin dev
            DEV_TIP="$(git rev-parse FETCH_HEAD)"

            DEV_VERSION="$(git show "$DEV_TIP:src/GloomhavenVR/GloomhavenVR.csproj" \
                           | sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' | head -1)"
            if [[ "$DEV_VERSION" != "$VERSION" ]]; then
              # Somebody set the number by hand (a --minor or --major bump on dev is
              # exactly how a non-patch release is prepared). Do not fight them.
              echo "::notice title=No bump needed::dev already says <Version>$DEV_VERSION, not $VERSION — leaving it alone."
              exit 0
            fi

            git checkout -B release-bump "$DEV_TIP"
            NEXT="$(bash scripts/bump-version.sh --patch)"
            git add src/GloomhavenVR/GloomhavenVR.csproj
            git commit -m "chore(release): set <Version> to $NEXT after $TAG"

            if git push origin HEAD:dev; then
              echo "::notice title=Next version::dev is now at <Version>$NEXT."
              exit 0
            fi

            echo "push to dev rejected (attempt $attempt/3) — refetching and retrying"
          done

          echo "::error title=Release published, version bump FAILED::$TAG is published and"
          echo "::error::complete — the tag, the zip and the release are all correct and nothing"
          echo "::error::needs re-running. ONLY the bookkeeping bump did not land."
          echo "::error::"
          echo "::error::Fix it by hand, on dev, one line:"
          echo "::error::    bash scripts/bump-version.sh --patch"
          echo "::error::    git commit -am 'chore(release): set <Version> after $TAG' && git push origin dev"
          echo "::error::"
          echo "::error::If this keeps happening, a branch ruleset on 'dev' is blocking"
          echo "::error::github-actions[bot]. Either add it to that ruleset's bypass list or drop"
          echo "::error::the ruleset on 'dev' — see docs/CI-CD.md section 2.1."
          exit 1
