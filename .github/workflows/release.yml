# Releases build and tag the exact commit pushed to main. Protected main is updated
# through a reviewed dev -> main PR using a merge commit; a fast-forward is also valid.
# Provenance requires either existing dev ancestry or an unchanged merge of a dev
# ancestor. The workflow never commits to main. After publication it records the
# release merge in current dev history and advances dev's next version if needed.
# Concurrent dev work is retained; every dev push is a normal fast-forward retry.
# See docs/CI-CD.md and the production-helper tests in scripts/release-sim.sh.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write        # push the tag, create the release, push the bookkeeping bump
                         # to `dev`. GITHUB_TOKEN with this scope is sufficient — no PAT
                         # is needed. A branch ruleset on `main` does NOT affect this
                         # workflow (it pushes no commit to main). A branch ruleset on
                         # `dev`, or a TAG ruleset on `v*`, would — docs/CI-CD.md §2.1.

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  # JOB-LEVEL, not `-p:` on one command: scripts/package-release.sh runs its own
  # `dotnet build` internally, and MSBuild reads environment variables as properties,
  # so this reaches every build in the job. A `-p:` would not.
  GhvrReleaseBuild: 'true'

jobs:
  release:
    name: Build, package and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history and tags — release notes need both)
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      # -----------------------------------------------------------------------------
      # Decide the version and refuse early. Everything here is cheap; none of it may
      # run after a fifteen-minute build, because the whole point is to fail before
      # anything has been produced that could be half-published.
      # -----------------------------------------------------------------------------
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
          rg --version

      - name: Release topology regression tests
        run: bash scripts/release-sim.sh

      - name: Determine the version and check it can be released
        id: version
        run: |
          set -euo pipefail

          # `bash scripts/bump-version.sh` with no argument PRINTS the version and
          # changes nothing. The release is of the number that is already committed —
          # the workflow no longer writes it, so there is no bump commit to place on
          # `main` and no dirty tree to stamp around.
          VERSION="$(bash scripts/bump-version.sh)"
          echo "Releasing $VERSION from ${GITHUB_SHA}"

          # BUILD 503 RECOVERY — v1.0.0 was published before the maintainer's final
          # hardware hotfixes landed. The maintainer explicitly asked for the existing
          # public release's DOWNLOAD to be refreshed from the final main commit, while
          # preserving the original annotated tag as immutable release provenance. This
          # is deliberately a SINGLE known tag and source commit, not a general escape
          # hatch for changing published versions. The publish step replaces only the
          # identically named ZIP and release body, then the normal dev bookkeeping moves
          # the next development version to 1.0.1.
          REFRESH_EXISTING=false
          FINAL_100_TAG_TARGET="b691d493519dca619215131004c811dfd6f98498"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            TAG_TARGET="$(git rev-parse "refs/tags/v$VERSION^{}")"
            if [[ "$VERSION" == "1.0.0" && "$TAG_TARGET" == "$FINAL_100_TAG_TARGET" ]]; then
              REFRESH_EXISTING=true
              echo "::notice title=Final 1.0.0 package refresh::Keeping immutable v1.0.0 tag at $TAG_TARGET; replacing its ZIP from $GITHUB_SHA."
            else
              echo "::error title=Version already released::Tag v$VERSION already exists."
              echo "::error::Nothing was built. Two ways this happens:"
              echo "::error::  (a) two releases were fired close together — the bump commit for the"
              echo "::error::      previous one is on 'dev', not on this commit. Run"
              echo "::error::      a new reviewed dev-to-main PR; dev now carries the bump."
              echo "::error::  (b) you re-pushed an old commit. Set <Version> in"
              echo "::error::      src/GloomhavenVR/GloomhavenVR.csproj past v$VERSION on dev."
              exit 1
            fi
          fi

          # FETCH_HEAD works even with actions/checkout's narrowed fetch refspec.
          git fetch --no-tags origin dev
          DEV_TIP="$(git rev-parse FETCH_HEAD)"
          git fetch --no-tags origin main
          MAIN_TIP="$(git rev-parse FETCH_HEAD)"
          bash scripts/release-provenance.sh check "$PWD" "$GITHUB_SHA" "$DEV_TIP" "$MAIN_TIP"

          # A release stamped `…-dirty` is a bug report waiting to happen. The old
          # design created a bump commit to guarantee a clean tree; this design starts
          # clean and asserts it instead of assuming it.
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error title=Dirty tree at checkout::The working tree is not clean before"
            echo "::error::the build; the DLL would be stamped '-dirty'."
            git status --porcelain --untracked-files=no
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "refresh_existing=$REFRESH_EXISTING" >> "$GITHUB_OUTPUT"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Verify selected SDK
        run: |
          dotnet --info
          SDK_VERSION="$(dotnet --version)"
          [[ "$SDK_VERSION" =~ ^8\.0\.4[0-9][0-9]$ ]] || {
            echo "::error::Expected CI SDK 8.0.4xx, selected $SDK_VERSION"
            exit 1
          }

      - name: Cache NuGet packages
        uses: actions/cache@v5.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Unity XR package sources
        uses: actions/cache@v5.1.0
        with:
          path: tools/RuntimeDepsBuild/sources
          key: xrsources-${{ hashFiles('scripts/build-runtimedeps.sh') }}

      - name: Verify reference assemblies contain no method bodies
        run: python3 scripts/check-refasm.py

      - name: Build Unity XR RuntimeDeps
        run: bash scripts/build-runtimedeps.sh

      - name: Fetch OpenXR natives
        # SHA256-pinned download from the needle-mirror package tag. No Unity editor
        # is involved: these two DLLs ship prebuilt inside com.unity.xr.openxr.
        run: bash scripts/fetch-natives.sh

      - name: Build (0 errors, 0 warnings — TreatWarningsAsErrors)
        run: bash scripts/ci-build.sh Release

      - name: Mirrored-constant lint
        run: bash scripts/check-mirrors.sh

      - name: Per-frame order lock
        run: bash scripts/check-frame-order.sh

      - name: Patch inventory drift
        run: bash scripts/patch-inventory.sh check

      - name: Wire coverage
        run: python3 scripts/check-wire-coverage.py

      # The four rules that keep a peer from being TOLD which card the game singled out
      # inside its own secret window. The C# original is compile-only in the wire-test
      # step below, so this standalone port is the only executed form. See ci.yml.
      - name: Card identity mask (ModBuild 477 item 7)
        run: python3 scripts/check-card-identity-mask.py

      # Every live config dial a mirror reads carries a recorded verdict saying whose
      # copy it is. The 1:1 question the other three gates cannot express. See ci.yml.
      - name: Mirror dials (whose copy does the mirror read)
        run: python3 scripts/check-mirror-dials.py

      # A latch array sized by a literal against an enum that grew. See ci.yml.
      - name: Enum-keyed array sizes
        run: python3 scripts/check-enum-arrays.py

      # THE EIGHT THE RELEASE PATH WAS MISSING. Found by the 2026-09 documentation audit,
      # which was checking whether docs/CI-CD.md's "the same gates as CI" was true. It was not:
      # the 2026-09 tooling round wired these into ci.yml and nobody carried them across, so the
      # RELEASE path — one push, no undo, straight to players — was the WEAKER of the two. What
      # covered the gap in practice is that a released commit has already been through ci.yml on
      # dev, which is a property of how the maintainer works and not of this pipeline.
      # All eight read only src/, docs/ and tracked files under .planning/refactor/: if they can
      # run on a runner for ci.yml they can run here, which is the argument ci.yml's own comment
      # block makes for them.
      - name: Static initialiser order across partial types
        run: python3 scripts/check-partial-order.py

      - name: Load-bearing writes inside diagnostics
        run: python3 scripts/check-instrument-writes.py

      - name: Remote constants resolve to the local defaults
        run: python3 scripts/check-remote-defaults.py

      - name: Board-tuning field ids in range and in order
        run: python3 scripts/check-tune-fields.py

      - name: Patches on network-action receivers are classified
        run: python3 scripts/check-desync-surface.py

      - name: HW-VERIFY lines print at the default log level
        run: python3 scripts/check-hw-verify.py

      - name: Every option is reachable in the menu
        run: python3 scripts/check-options-coverage.py

      - name: User-facing docs ship in English and German
        run: python3 scripts/check-docs-i18n.py

      # Skipped with a notice on a runner: the tester's cfg drop it compares against
      # lives in gitignored .planning/debug/. See the same step in ci.yml.
      - name: Config defaults rebase
        run: |
          if [ -d .planning/debug/default ]; then
            python3 scripts/rebase-defaults.py check
          else
            echo "::notice title=Config defaults not checked::The tester cfg drop is gitignored and absent on a runner. Run scripts/rebase-defaults.py check locally before a release."
          fi

      - name: Asset bundle format
        run: bash scripts/check-bundle-format.sh

      # These production-source harnesses provide their own Unity API substitutes and
      # can execute on a hosted runner; byte-level wire vectors still require the real game.
      - name: Native presentation regression harnesses
        run: |
          bash scripts/card-bindings-tests.sh
          bash scripts/native-playback-tests.sh
          bash scripts/board-refresh-tests.sh
          bash scripts/card-loss-modal-tests.sh
          bash scripts/map-flow-tests.sh
          bash scripts/map-button-tests.sh
          bash scripts/burn-layout-tests.sh
          bash scripts/remote-burn-sequencing-tests.sh
          bash scripts/burn-completion-tests.sh
          bash scripts/item-burn-tests.sh
          bash scripts/item-appearance-tests.sh
          bash scripts/flight-timing-tests.sh
          bash scripts/figure-hold-tests.sh
          bash scripts/self-update-dialog-tests.sh
          bash scripts/native-video-tests.sh
          bash scripts/reward-showcase-tests.sh
          bash scripts/modal-close-tests.sh
          bash scripts/reward-pose-tests.sh
          bash scripts/conversion-rollback-tests.sh
          bash scripts/panel-material-tests.sh
          bash scripts/panel-ink-tests.sh
          bash scripts/video-playback-tests.sh
          bash scripts/hint-tests.sh
          bash scripts/quest-hint-tests.sh

      - name: Wire tests (compile only — vectors need the real game DLL)
        run: |
          dotnet build tests/GloomhavenVR.WireTests/GloomhavenVR.WireTests.csproj \
                       -c Release --nologo -v minimal
          echo "::warning title=Wire vectors not executed for this release::The golden-vector assertions cannot run on a hosted runner (they load the game's real UnityEngine.CoreModule.dll). Run scripts/wire-tests.sh locally before pushing to main."

      - name: Package
        run: bash scripts/package-release.sh

      - name: Verify the artifact matches the version being tagged
        run: |
          set -euo pipefail
          ZIP="dist/GloomhavenVR-${{ steps.version.outputs.version }}.zip"
          [[ -f "$ZIP" ]] || { echo "::error::$ZIP was not produced"; ls -la dist || true; exit 1; }
          echo "artifact: $ZIP ($(stat -c%s "$ZIP") bytes)"
          # The bundle is the bulk of it. If it is missing the zip is ~4 MB and the
          # mod silently falls back to procedural visuals for every 3D asset.
          # A FILE, NOT A PIPE, for the reason written at the same test in
          # scripts/package-release.sh: `unzip -l | grep -q` under `set -o pipefail` reports
          # failure when grep exits early and SIGPIPEs unzip, so a correct zip can fail to
          # publish. Harmless at ~15 entries, wrong by construction.
          unzip -l "$ZIP" > /tmp/zip-listing.txt
          grep -qF 'BepInEx/plugins/GloomhavenVR/gloomhavenvr.bundle' /tmp/zip-listing.txt \
            || { echo "::error::the asset bundle is not in the archive"; exit 1; }
          # The build must not have dirtied a tracked file behind our back — the stamp
          # inside that DLL is only trustworthy if this is still true.
          [[ -z "$(git status --porcelain --untracked-files=no)" ]] \
            || { echo "::error::the build modified tracked files; the DLL stamp reads '-dirty'";
                 git status --porcelain --untracked-files=no; exit 1; }

      - name: Render release notes
        run: bash scripts/release-notes.sh "${{ steps.version.outputs.version }}" RELEASE_NOTES.md

      # -----------------------------------------------------------------------------
      # Publish. Tag FIRST, release SECOND: a rejected tag push must leave nothing
      # behind, and `gh release create --verify-tag` refuses to invent one.
      #
      # No commit is pushed to main. The tag names the tested main commit, including
      # a PR merge commit when that is how the release branch was updated.
      # -----------------------------------------------------------------------------
      - name: Push the tag
        if: ${{ steps.version.outputs.refresh_existing != 'true' }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          # Re-read from the remote: the early check was ~15 minutes ago.
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG appeared on the remote while this release was building."
            echo "::error::Nothing was published. Someone else released this version."
            exit 1
          fi

          # `main` may legitimately have moved FORWARD while we built (a second push).
          # That is fine — our tag names the commit we actually built and tested. What
          # is not fine is `main` having moved AWAY from it (a force-push backwards):
          # the tag would then advertise a commit the release branch no longer has.
          git fetch --no-tags origin main          # FETCH_HEAD — see the version step
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$(git rev-parse FETCH_HEAD)"; then
            echo "::error::main no longer contains $GITHUB_SHA — it was rewritten while"
            echo "::error::this release was building. Nothing was published."
            exit 1
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "GloomhavenVR ${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "pushed $TAG -> $GITHUB_SHA"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="dist/GloomhavenVR-${{ steps.version.outputs.version }}.zip"
          if [[ "${{ steps.version.outputs.refresh_existing }}" == "true" ]]; then
            gh release upload "${{ steps.version.outputs.tag }}" "$ZIP" --clobber
            gh release edit "${{ steps.version.outputs.tag }}" \
              --title "GloomhavenVR ${{ steps.version.outputs.version }}" \
              --notes-file RELEASE_NOTES.md \
              --latest
            echo "Refreshed ${{ steps.version.outputs.tag }} from ${GITHUB_SHA}; immutable tag retained."
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              "$ZIP" \
              --title "GloomhavenVR ${{ steps.version.outputs.version }}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              --latest
            echo "Published ${{ steps.version.outputs.tag }}"
          fi

      # -----------------------------------------------------------------------------
      # Bookkeeping — AFTER the release is live, because it is not part of the release.
      # If this step fails the release is still complete and correct; only the next
      # version number needs a hand. That is the whole reason it is last.
      #
      # Retain the PR merge in dev ancestry before its next version bump. Concurrent
      # work and an independently advanced version are preserved. No skip-ci marker:
      # the next real release must remain eligible even when no feature work intervenes.
      # -----------------------------------------------------------------------------
      - name: Bump <Version> on dev for the next release
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Keep the reviewed helper available when checking out a concurrently
          # advanced dev tree. Build outputs are ignored and are never committed.
          PROVENANCE_SCRIPT="$(mktemp)"
          cp scripts/release-provenance.sh "$PROVENANCE_SCRIPT"
          trap 'rm -f "$PROVENANCE_SCRIPT"' EXIT
          for attempt in 1 2 3; do
            git fetch --no-tags origin dev
            DEV_TIP="$(git rev-parse FETCH_HEAD)"
            git fetch --no-tags origin main
            MAIN_TIP="$(git rev-parse FETCH_HEAD)"
            if ! bash "$PROVENANCE_SCRIPT" prepare "$PWD" "$GITHUB_SHA" "$DEV_TIP" "$MAIN_TIP" "$VERSION"; then
              echo "::error::Release $TAG is already published; local dev bookkeeping failed. Review the provenance/merge error above and repair dev without rerunning publication."
              exit 1
            fi

            if git push origin HEAD:dev; then
              echo "::notice title=Dev bookkeeping complete::Release ancestry and next version are recorded on dev."
              exit 0
            fi
            echo "push to dev rejected (attempt $attempt/3) — refetching and retrying"
          done

          echo "::error title=Release published, version bump FAILED::$TAG is published and"
          echo "::error::complete — the tag, the zip and the release are all correct and nothing"
          echo "::error::needs re-running. ONLY the bookkeeping bump did not land."
          echo "::error::"
          echo "::error::Fetch current dev/main, merge $GITHUB_SHA into dev, then advance"
          echo "::error::the version only if it still says $VERSION. Push dev normally."
          echo "::error::scripts/release-provenance.sh prepare performs that local bookkeeping."
          echo "::error::"
          echo "::error::If this keeps happening, a branch ruleset on 'dev' is blocking"
          echo "::error::github-actions[bot]. Either add it to that ruleset's bypass list or drop"
          echo "::error::the ruleset on 'dev' — see docs/CI-CD.md section 2.1."
          exit 1
