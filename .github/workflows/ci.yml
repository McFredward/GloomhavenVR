# GloomhavenVR — CI for the working branch.
#
# Builds the mod and runs the project's own gates on every push and pull request to
# `dev`. It NEVER releases, NEVER tags and NEVER bumps a version — `dev` builds are
# not shipped, by decision.
#
# HOW IT BUILDS WITHOUT THE GAME
# ------------------------------
# The runner has no Gloomhaven install. Directory.Build.props sees that $(GameManaged)
# holds no GH.Runtime.dll and falls back to the committed reference assemblies in
# libs/RefAsm — metadata only, no method bodies (libs/RefAsm/README.md). Nothing has
# to be configured here for that to happen; the fallback announces itself in the log.
#
# See docs/CI-CD.md for the whole pipeline and for what CI deliberately cannot check.
name: CI

# PULL REQUESTS TO `main` ARE INCLUDED ON PURPOSE. The repository is public, so anyone
# who is not a collaborator can only contribute by forking and opening a pull request,
# and a branch ruleset on `main` (docs/CI-CD.md §2.1) makes a PR the only way in for
# collaborators too. A PR targeting a branch this workflow does not list gets no gates
# at all — silently. This is also the job a "require status checks" rule would select.
#
# A pull_request run from a FORK gets a read-only token and no secrets. Nothing here
# needs either: artifact cleanup is limited to trusted dev runs, and uploads require
# an explicit manual request. Every gate is a local read of the tree.
on:
  workflow_dispatch:
    inputs:
      upload_dev_build:
        description: 'Upload a temporary DLL build for hardware testing (dev only)'
        required: false
        type: boolean
        default: false
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# Normal pushes supersede older checks. Manual artifact requests share a serialized
# group so pruning to two before one upload cannot leave more than three dev builds.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_dev_build && 'ci-dev-artifacts' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.upload_dev_build }}

jobs:
  prune_dev_artifacts:
    name: Maintain optional dev artifact storage
    if: ${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload_dev_build)) }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    concurrency:
      group: ci-dev-artifact-cleanup
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    outputs:
      can_upload: ${{ steps.prune.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Retain recent dev artifacts and reserve any requested upload slot
        id: prune
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DEV_BUILDS: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_dev_build && '2' || '3' }}
        run: python3 scripts/prune-dev-artifacts.py --repo "$GITHUB_REPOSITORY" --keep "$KEEP_DEV_BUILDS" --max-age-days 2 --apply
      - name: Report cleanup failure
        if: ${{ !cancelled() && steps.prune.outcome != 'success' }}
        run: |
          echo '::warning::Optional dev artifact cleanup failed. Checks will still run; a requested dev upload is skipped until cleanup succeeds.'
          echo 'Dev artifact maintenance failed. Review the cleanup step; build/test results remain authoritative.' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and gates
    needs: prune_dev_artifacts
    # Storage maintenance is optional; a skipped or failed cleanup must not skip checks.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        # Shallow is fine: the build stamps `git rev-parse --short HEAD`, which a
        # depth-1 checkout answers correctly. Only the release workflow needs history.

      - name: Validate manual artifact request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_dev_build && github.ref != 'refs/heads/dev' }}
        run: |
          echo "::error::Temporary DLL uploads are available only on dev. Select dev when running CI."
          exit 1

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
          rg --version

      - name: Release topology regression tests
        run: bash scripts/release-sim.sh

      - name: Artifact cleanup regression tests
        run: python3 -m unittest discover -s tests -p 'test_prune_dev_artifacts.py'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Verify selected SDK
        run: |
          dotnet --info
          SDK_VERSION="$(dotnet --version)"
          [[ "$SDK_VERSION" =~ ^8\.0\.4[0-9][0-9]$ ]] || {
            echo "::error::Expected CI SDK 8.0.4xx, selected $SDK_VERSION"
            exit 1
          }

      - name: Cache NuGet packages
        uses: actions/cache@v5.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Unity XR package sources
        # scripts/build-runtimedeps.sh clones three needle-mirror repos at pinned TAGS
        # and skips the clone when the cached checkout's package.json already says the
        # right version. Caching the checkouts turns that into a no-op on most runs.
        uses: actions/cache@v5.1.0
        with:
          path: tools/RuntimeDepsBuild/sources
          key: xrsources-${{ hashFiles('scripts/build-runtimedeps.sh') }}

      # ---------------------------------------------------------------------------
      # Gate 0 — the committed stubs must still be stubs.
      # This is what keeps "no game code in this repository" true. It is first because
      # everything else compiles against them.
      # ---------------------------------------------------------------------------
      - name: Verify reference assemblies contain no method bodies
        run: python3 scripts/check-refasm.py

      # ---------------------------------------------------------------------------
      # The three XR assemblies the mod compiles against AND ships. They are not
      # committed (libs/README.md); they are rebuilt from pinned package sources.
      # ---------------------------------------------------------------------------
      - name: Build Unity XR RuntimeDeps
        run: bash scripts/build-runtimedeps.sh

      - name: Build (0 errors, 0 warnings — TreatWarningsAsErrors)
        run: bash scripts/ci-build.sh Release

      # ---------------------------------------------------------------------------
      # Source-only gates. None of these needs the game, so all of them run.
      # ---------------------------------------------------------------------------
      - name: Mirrored-constant lint
        run: bash scripts/check-mirrors.sh

      - name: Per-frame order lock
        run: bash scripts/check-frame-order.sh

      - name: Patch inventory drift
        run: bash scripts/patch-inventory.sh check

      - name: Wire coverage
        run: python3 scripts/check-wire-coverage.py

      # ---------------------------------------------------------------------------
      # THE ANTI-LEAK GUARD, AND IT IS HERE BECAUSE IT WAS NOWHERE.
      #
      # tests/GloomhavenVR.WireTests/CardIdentityMaskVectors.cs is the only thing in
      # the repository that can notice the ModBuild 477 card-identity leak coming back
      # (a mirrored decision row published confirm='Verbrennen "Zusatzdolch"' to every
      # peer inside the game's own secret window). It is a PURE TEXT LINT — two
      # File.ReadAllText calls and three regexes, no Unity type anywhere — but it lives
      # in the wire-test executable, which is compile-only here for the reason §5 of
      # docs/CI-CD.md gives. So it has never once run in CI. Review R1 of 2026-09-07,
      # finding F2: "It is GREEN today. The rule holds — nothing enforces it."
      #
      # scripts/check-card-identity-mask.py is the same four rules as a standalone
      # checker that needs no game DLL. The C# file stays where it is as the
      # belt-and-braces local run; this is the braces.
      # ---------------------------------------------------------------------------
      - name: Card identity mask (ModBuild 477 item 7)
        run: python3 scripts/check-card-identity-mask.py

      # ---------------------------------------------------------------------------
      # THE QUESTION NO OTHER GATE ASKS. check-remote-defaults.py compares frozen
      # constants, check-wire-coverage.py asks whether a dial is ON THE WIRE, and
      # check-mirrors.sh compares declared groups. Review R2 of 2026-09-07 ran a 1:1
      # audit with all three green and found most of its confirmed findings invisible
      # to all three by construction, because none of them asks: at runtime, does the
      # mirror read the OWNER's copy of this value or the VIEWER's? Four confirmed
      # instances shipped in ModBuild 479. This gate asks it.
      # ---------------------------------------------------------------------------
      - name: Mirror dials (whose copy does the mirror read)
        run: python3 scripts/check-mirror-dials.py

      # ---------------------------------------------------------------------------
      # An enum grew by two members last build and the latch arrays keyed by it kept
      # their `new bool[4]`. The index throws, BuildBurnRig's catch swallows it and
      # logs at the DEBUG tier, and two of six card-FX surfaces were simply dead with
      # nothing in the log at the shipped level (review R2 F1, ModBuild 479). The
      # file's own doc comments still said "four surfaces". Mechanical, so gated.
      # ---------------------------------------------------------------------------
      - name: Enum-keyed array sizes
        run: python3 scripts/check-enum-arrays.py

      # ---------------------------------------------------------------------------
      # THE NINE GATES THE DESK RAN AND THIS FILE DID NOT. scripts/refactor-guard.sh check
      # runs seventeen checkers; until the 2026-09 refactor's tooling review this workflow
      # ran eight of them and nobody had listed which. Every one below reads only src/,
      # docs/ and tracked files under .planning/refactor (PARTIAL-ORDER.allow,
      # INSTRUMENT-WRITES.baseline, MIRROR-DIALS.allow, …) — no game, no bundle, no
      # cfg drop — and each was run from a foreign cwd against a planted positive and an
      # unmodified control before it was wired here. check-docs-i18n.py had no automatic
      # caller anywhere (DEVELOPING.md said so); it has one now.
      # ---------------------------------------------------------------------------
      - name: Static initialiser order across partial types
        run: python3 scripts/check-partial-order.py

      - name: Load-bearing writes inside diagnostics
        run: python3 scripts/check-instrument-writes.py

      - name: Remote constants resolve to the local defaults
        run: python3 scripts/check-remote-defaults.py

      - name: Board-tuning field ids in range and in order
        run: python3 scripts/check-tune-fields.py

      - name: Patches on network-action receivers are classified
        run: python3 scripts/check-desync-surface.py

      - name: HW-VERIFY lines print at the default log level
        run: python3 scripts/check-hw-verify.py

      - name: Every option is reachable in the menu
        run: python3 scripts/check-options-coverage.py

      - name: User-facing docs ship in English and German
        run: python3 scripts/check-docs-i18n.py

      # ---------------------------------------------------------------------------
      # THE USER-FACING SURFACE THE ASSEMBLY DOES NOT CARRY, diffed against the PR's base.
      # A removed config key does not error — the player's tuned value is simply never
      # read again; a reworded log marker costs a hardware round. On the desk the guard
      # diffs against a stored baseline; a runner has no baseline, so this builds one:
      # the base commit's src/ is unpacked with `git archive` (one fetched object, no
      # history, no second checkout) and censused with THIS commit's check-surface.py,
      # so both sides are counted by the same rules. Push events have no base to name
      # and skip this; the desk guard covers them.
      # ---------------------------------------------------------------------------
      - name: Config keys, patch registrations and log markers vs the PR base
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          rm -rf /tmp/surface-base && mkdir -p /tmp/surface-base/scripts
          git archive "$BASE_SHA" src | tar -x -C /tmp/surface-base
          cp scripts/check-surface.py scripts/check-options-coverage.py /tmp/surface-base/scripts/
          python3 /tmp/surface-base/scripts/check-surface.py snapshot /tmp/surface-base.json
          python3 scripts/check-surface.py snapshot /tmp/surface-head.json
          python3 scripts/check-surface.py diff /tmp/surface-base.json /tmp/surface-head.json

      # ---------------------------------------------------------------------------
      # This gate compares the shipped defaults against a TESTER'S cfg drop, and that
      # drop lives in .planning/debug/, which is gitignored. On a runner the directory
      # does not exist, and the script exits 1 with "no cfg directory" — which is what
      # actually broke the first CI runs. Absence is not drift: there is simply nothing
      # to compare against here. It is skipped WITH A NOTICE rather than silently, and
      # the script is left strict on purpose, because locally the missing directory
      # really does mean "you forgot to drop the cfgs".
      # ---------------------------------------------------------------------------
      - name: Config defaults rebase
        run: |
          if [ -d .planning/debug/default ]; then
            python3 scripts/rebase-defaults.py check
          else
            echo "::notice title=Config defaults not checked::scripts/rebase-defaults.py compares the shipped defaults against a tester's cfg drop in .planning/debug/default, which is gitignored and absent on a runner. Run it locally before a release."
          fi

      # ---------------------------------------------------------------------------
      # The asset bundle IS committed (prebuilt/gloomhavenvr.bundle, 70,218,494
      # bytes), so this gate runs in CI in full. It asserts the UnityFS wrapper is
      # format 7 and was written by 2021.3.5f1 — a format 8 bundle silently degrades
      # every 3D asset in the mod to its procedural fallback, which has shipped twice.
      # ---------------------------------------------------------------------------
      - name: Asset bundle format
        run: bash scripts/check-bundle-format.sh

      # ---------------------------------------------------------------------------
      # Wire tests: COMPILE ONLY, and this is not a shortcut we could avoid.
      #
      # tests/GloomhavenVR.WireTests LOADS the game's real UnityEngine.CoreModule.dll
      # at runtime because the golden vectors depend on Mathf.RoundToInt's banker's
      # rounding, which sits on the quantization path. A reference assembly cannot be
      # executed — the CLR refuses it with
      #   BadImageFormatException: Cannot load a reference assembly for execution
      # and the NuGet UnityEngine.Modules stub throws NullReferenceException instead.
      # Both verified, not assumed.
      #
      # Compiling still buys something real: that project's <Compile Include> list is
      # the tripwire for a moved or renamed wire file, and it fails here exactly as
      # designed. The 210,000+ byte-level assertions do not run — a developer runs
      # scripts/wire-tests.sh. docs/CI-CD.md says so out loud.
      # ---------------------------------------------------------------------------
      # These production-source harnesses provide their own Unity API substitutes and
      # can execute on a hosted runner; byte-level wire vectors still require the real game.
      - name: Native presentation regression harnesses
        run: |
          bash scripts/card-bindings-tests.sh
          bash scripts/native-playback-tests.sh
          bash scripts/board-refresh-tests.sh
          bash scripts/card-loss-modal-tests.sh
          bash scripts/map-flow-tests.sh
          bash scripts/map-button-tests.sh
          bash scripts/flight-timing-tests.sh
          bash scripts/figure-hold-tests.sh
          bash scripts/self-update-dialog-tests.sh
          bash scripts/native-video-tests.sh
          bash scripts/reward-showcase-tests.sh
          bash scripts/panel-material-tests.sh
          bash scripts/panel-ink-tests.sh
          bash scripts/video-playback-tests.sh
          bash scripts/hint-tests.sh
          bash scripts/quest-hint-tests.sh

      - name: Wire tests (compile only — see docs/CI-CD.md)
        run: |
          dotnet build tests/GloomhavenVR.WireTests/GloomhavenVR.WireTests.csproj \
                       -c Release --nologo -v minimal
          echo
          echo "::notice title=Wire vectors not executed::The golden-vector assertions need the game's real UnityEngine.CoreModule.dll (Mathf banker's rounding) and cannot run on a hosted runner. Run scripts/wire-tests.sh locally before a release."

      # ---------------------------------------------------------------------------
      # A temporary DLL download is an explicit hardware-test request. Normal pushes
      # and PRs keep their checks/logs but consume no Actions artifact storage.
      # Full release ZIPs remain mandatory uploads through release.yml on main.
      # ---------------------------------------------------------------------------
      - name: Upload requested dev build (plugin + preloader only)
        id: dev_upload
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_dev_build && github.ref == 'refs/heads/dev' && needs.prune_dev_artifacts.outputs.can_upload == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v6.0.0
        with:
          name: GloomhavenVR-dev-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/GloomhavenVR/bin/Release/net472/GloomhavenVR.dll
            src/GloomhavenVR.Preload/bin/Release/net472/GloomhavenVR.Preload.dll
          if-no-files-found: error
          retention-days: 2

      - name: Report optional dev download
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.upload_dev_build && github.ref == 'refs/heads/dev' }}
        env:
          CLEANUP_READY: ${{ needs.prune_dev_artifacts.outputs.can_upload }}
          UPLOAD_OUTCOME: ${{ steps.dev_upload.outcome }}
        run: |
          if [ "$UPLOAD_OUTCOME" = success ]; then
            echo 'Temporary DLL download uploaded. Retained for at most two days; at most three dev builds are kept.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CLEANUP_READY" != true ]; then
            echo '::warning::Dev download skipped because storage cleanup failed. Build/test results remain authoritative. Release uploads are unaffected.'
            echo 'No dev download: optional artifact cleanup failed. Review the cleanup job. Build/test results remain authoritative.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$UPLOAD_OUTCOME" = failure ]; then
            echo '::warning::Optional dev upload failed. Check artifact storage/quota; GitHub may need 6-12 hours to refresh usage after deletion. Build/test results remain authoritative.'
            echo 'No dev download: optional upload failed. Review its error above; this does not suppress build/test failures.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No dev download: build or validation did not reach upload. Review the failed checks.' >> "$GITHUB_STEP_SUMMARY"
